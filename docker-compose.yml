# Base de datos local. Uso: docker compose up -d
# Lee usuario, contraseña y puerto desde .env (copiar de .env.example).
services:
  db:
    image: postgres:16-alpine
    container_name: porteria-db
    environment:
      POSTGRES_DB: ${DB_NAME:-porteria}
      POSTGRES_USER: ${DB_USER:-porteria}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-porteria}
      TZ: America/Lima
      PGTZ: America/Lima
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - porteria-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  porteria-data:
