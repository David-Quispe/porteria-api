; Firmware del circuito de portería: ESP32 + PN532 + LEDs + buzzer.
; Compilar: pio run      Subir: pio run -t upload      Ver Serial: pio device monitor
; Antes de compilar: copiar include/secrets.example.h como include/secrets.h y completarlo.

[env:esp32dev]
platform = espressif32@7.1.3
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps =
    adafruit/Adafruit PN532@^1.3.4
    bblanchon/ArduinoJson@^7.4.3
